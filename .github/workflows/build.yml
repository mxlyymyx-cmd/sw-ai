# SWAI — GitHub Actions 自动打包
# 每次 push 到 main 分支，自动编译 SWAI.exe
name: Build SWAI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 打包 SWAI.exe
        run: |
          pyinstaller --noconfirm build/mech_forge.spec

      - name: 📦 压缩为 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path SWAI-v1.0
          Copy-Item dist\SWAI.exe -Destination SWAI-v1.0\
          Copy-Item README.md -Destination SWAI-v1.0\
          Compress-Archive -Path SWAI-v1.0\* -DestinationPath SWAI-win64.zip -Force

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SWAI-win64
          path: SWAI-win64.zip
          if-no-files-found: error
