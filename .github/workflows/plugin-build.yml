name: Build Plugin Installer

on:
  push:
    branches: [ "main" ]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-build.yml"
      - "api.py"
      - "ai_chat.py"
      - "requirements-plugin.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🛠 安装 Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装 NuGet CLI
        uses: nuget/setup-nuget@v2

      - name: 📥 下载 SolidWorks Interop DLL（从 NuGet）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path plugin\libs | Out-Null
          
          $packages = @(
            @{id="SolidWorks.Interop.sldworks"; version="32.1.0"},
            @{id="SolidWorks.Interop.swcommands"; version="32.1.0"},
            @{id="SolidWorks.Interop.swconst"; version="32.1.0"},
            @{id="SolidWorks.Interop.swpublished"; version="32.1.0"}
          )
          
          foreach ($pkg in $packages) {
            $nupkg = "$($pkg.id).$($pkg.version).nupkg"
            $url = "https://www.nuget.org/api/v2/package/$($pkg.id)/$($pkg.version)"
            
            Write-Host "📥 下载: $($pkg.id) v$($pkg.version)"
            Invoke-WebRequest -Uri $url -OutFile "plugin\libs\$nupkg" -UseBasicParsing
            
            $extractDir = "plugin\libs\$($pkg.id)"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -Path "plugin\libs\$nupkg" -DestinationPath $extractDir -Force
            
            $dllName = "$($pkg.id).dll"
            $dllPath = Join-Path $extractDir "lib\net451\$dllName"
            if (!(Test-Path $dllPath)) {
              $dllPath = Join-Path $extractDir "lib\net40\$dllName"
            }
            if (!(Test-Path $dllPath)) {
              $dllPath = Join-Path $extractDir "lib\net45\$dllName"
            }
            
            if (Test-Path $dllPath) {
              Copy-Item $dllPath -Destination "plugin\libs\$dllName" -Force
              Write-Host "  ✅ $dllName 就绪"
            } else {
              Write-Host "  ⚠️  未找到 $dllName，搜索 lib/ 目录..."
              $found = Get-ChildItem -Path $extractDir -Recurse -Filter "$($pkg.id).dll" | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName -Destination "plugin\libs\$dllName" -Force
                Write-Host "  ✅ $dllName 就绪 (从 $($found.FullName))"
              } else {
                Write-Host "  ❌ 找不到 $dllName"
              }
            }
            
            Remove-Item "plugin\libs\$nupkg" -Force -ErrorAction SilentlyContinue
            Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host ""
          Write-Host "验证 DLL..."
          Get-ChildItem plugin\libs\*.dll | ForEach-Object {
            Write-Host "  ✅ $($_.Name) ($($_.Length / 1KB) KB)"
          }

      - name: 🔨 编译 C# 插件
        shell: pwsh
        run: |
          if (Test-Path "plugin/libs/SolidWorks.Interop.sldworks.dll") {
            Write-Host "✅ SolidWorks Interop DLL 已就绪，开始编译..."
            msbuild plugin/SWAIAddin.csproj /p:Configuration=Release /p:Platform=AnyCPU
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ 编译成功"
            } else {
              Write-Host "❌ 编译失败"
              exit 1
            }
          } else {
            Write-Host "⚠️ 未找到 SolidWorks Interop DLL，跳过插件构建"
            exit 1
          }

      - name: 🐍 安装 Python 依赖
        shell: pwsh
        run: |
          pip install -r requirements-plugin.txt
          pip install pyinstaller

      - name: 📦 打包 Python API 服务为独立 exe（静默后台，无黑窗口）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # --onefile 单文件模式 + --noconsole 隐藏控制台窗口（服务静默后台运行）
          pyinstaller --onefile --noconsole --name SWAIServer --clean --noconfirm `
            --hidden-import flask --hidden-import flask_cors --hidden-import requests `
            api.py
          if (!(Test-Path "dist\SWAIServer.exe")) {
            Write-Host "❌ PyInstaller 打包 SWAIServer 失败"
            exit 1
          }
          Write-Host "✅ SWAIServer.exe 就绪: $((Get-Item 'dist\SWAIServer.exe').Length / 1MB) MB"

      - name: 💬 打包聊天窗口桌面应用（SWAIChat.exe）
        shell: pwsh
        run: |
          # 聊天 GUI：双击打开就是正常对话界面，自动拉起本地服务
          pyinstaller --onefile --noconsole --name SWAIChat --clean --noconfirm `
            --hidden-import flask --hidden-import flask_cors --hidden-import requests `
            --hidden-import api --hidden-import ai_chat `
            --collect-submodules flange --collect-submodules impeller --collect-submodules axial `
            chat_gui.py
          if (!(Test-Path "dist\SWAIChat.exe")) {
            Write-Host "❌ PyInstaller 打包 SWAIChat 失败"
            exit 1
          }
          Write-Host "✅ SWAIChat.exe 就绪: $((Get-Item 'dist\SWAIChat.exe').Length / 1MB) MB"

      - name: 📦 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: 🏗 构建安装程序
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            # 兼容 choco 安装的其他路径
            $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          }
          Write-Host "使用 ISCC: $iscc"
          & $iscc plugin\installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ 安装包构建失败"
            exit 1
          }

      - name: 📋 列出构建产物
        shell: pwsh
        run: |
          Get-ChildItem dist\* -Recurse | ForEach-Object { Write-Host "  📦 $($_.FullName) ($($_.Length / 1KB) KB)" }

      - name: 📤 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SWAI-Setup
          path: dist\SWAI-Setup-*.exe
          if-no-files-found: error

      - name: 📤 上传插件 ZIP（保留原分发方式）
        uses: actions/upload-artifact@v4
        with:
          name: SWAI-Plugin-win32
          path: |
            plugin\bin\AnyCPU\Release\SWAIAddin.dll
            plugin\install.ps1
            plugin\README-install.md
          if-no-files-found: warn
